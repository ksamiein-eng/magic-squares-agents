<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#dde7ff"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#1b1b1b">Rigidity Lab: a paper that attacks its own open problems</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#555">Paper2Agent conversion of a magic-squares-of-squares paper + a specialist team + an adversarial referee</text>

  <!-- paper -->
  <rect x="40" y="90" width="250" height="110" rx="10" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/>
  <text x="165" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#6b4b00">Paper (29 pp) + proof tree</text>
  <text x="165" y="136" text-anchor="middle" font-size="12" fill="#444">251 verification files, 16 stages</text>
  <text x="165" y="154" text-anchor="middle" font-size="12" fill="#444">2,064 exact certificates (r = 2)</text>
  <text x="165" y="172" text-anchor="middle" font-size="12" fill="#444">genus-5 curve, 113 orbits, Hadamard surfaces</text>
  <text x="165" y="190" text-anchor="middle" font-size="11" fill="#777">all stages pass: 3 min 45 s</text>

  <!-- MCP -->
  <rect x="340" y="90" width="320" height="110" rx="10" fill="url(#g1)" stroke="#4a6fd6" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1f3a93">rational_circle MCP server</text>
  <text x="500" y="136" text-anchor="middle" font-size="12" fill="#333">14 tools · 5 resources · 3 prompts</text>
  <text x="500" y="154" text-anchor="middle" font-size="11" fill="#333">run_verification_stage · evaluate_configuration</text>
  <text x="500" y="170" text-anchor="middle" font-size="11" fill="#333">genus5_point_search · genus5_quotient_structure</text>
  <text x="500" y="186" text-anchor="middle" font-size="11" fill="#333">two_prime_coverage · four_parameter_sweep · ...</text>
  <line x1="290" y1="145" x2="338" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="314" y="138" text-anchor="middle" font-size="10" fill="#555">Paper2MCP</text>

  <!-- Problem box -->
  <rect x="710" y="90" width="450" height="110" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
  <text x="935" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Open targets in the paper</text>
  <text x="725" y="134" font-size="11.5" fill="#333">• Conj 7.3: C: Y² = h¹²+70h¹⁰−1009h⁸+7060h⁶−1009h⁴+70h²+1 has only 8 rational points</text>
  <text x="725" y="152" font-size="11.5" fill="#333">• Thm 1.1 (r = 2) proved only through exponent sum 7</text>
  <text x="725" y="170" font-size="11.5" fill="#333">• Conj 8.6: every rational solution lies on a torsion coset (untested)</text>
  <text x="725" y="188" font-size="11.5" fill="#333">• ten of fifteen three-prime orbits unresolved; r = 4 swept only to height 4</text>

  <!-- agents row -->
  <g font-size="12">
    <rect x="40"  y="260" width="200" height="120" rx="10" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="140" y="283" text-anchor="middle" font-weight="600" fill="#176b3a">auditor</text>
    <text x="140" y="304" text-anchor="middle" fill="#333">reruns the 16 stages</text>
    <text x="140" y="322" text-anchor="middle" fill="#333">re-derives identities</text>
    <text x="140" y="340" text-anchor="middle" fill="#333">tags every claim</text>

    <rect x="270" y="260" width="200" height="120" rx="10" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="370" y="283" text-anchor="middle" font-weight="600" fill="#176b3a">point-hunter</text>
    <text x="370" y="304" text-anchor="middle" fill="#333">sieved exact search on C,</text>
    <text x="370" y="322" text-anchor="middle" fill="#333">its genus-2 quotient, E₀</text>
    <text x="370" y="340" text-anchor="middle" fill="#333">+ r = 4 sweeps per orbit</text>

    <rect x="500" y="260" width="200" height="120" rx="10" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="600" y="283" text-anchor="middle" font-weight="600" fill="#176b3a">quotient-geometer</text>
    <text x="600" y="304" text-anchor="middle" fill="#333">h→−h, h→1/h split Jac(C)</text>
    <text x="600" y="322" text-anchor="middle" fill="#333">E₀=123.a1 E₊=492.b1 E₋=1968.j1</text>
    <text x="600" y="340" text-anchor="middle" fill="#333">all rank 1 ⇒ Chabauty needed</text>

    <rect x="730" y="260" width="200" height="120" rx="10" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="830" y="283" text-anchor="middle" font-weight="600" fill="#176b3a">certificate-extender</text>
    <text x="830" y="304" text-anchor="middle" fill="#333">same resultant + witness-</text>
    <text x="830" y="322" text-anchor="middle" fill="#333">prime method, sum 7 → 8</text>
    <text x="830" y="340" text-anchor="middle" fill="#333">stdlib checker must accept</text>

    <rect x="960" y="260" width="200" height="120" rx="10" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="1060" y="283" text-anchor="middle" font-weight="600" fill="#176b3a">torsion-prober</text>
    <text x="1060" y="304" text-anchor="middle" fill="#333">every exact solution of the</text>
    <text x="1060" y="322" text-anchor="middle" fill="#333">48 systems, height ≤ 3</text>
    <text x="1060" y="340" text-anchor="middle" fill="#333">Gaussian-prime kernel test</text>
  </g>
  <!-- arrows MCP -> agents -->
  <g stroke="#4a6fd6" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <path d="M500,200 L140,258"/><path d="M500,200 L370,258"/><path d="M500,200 L600,258"/><path d="M500,200 L830,258"/><path d="M500,200 L1060,258"/>
  </g>

  <!-- skeptic -->
  <rect x="400" y="430" width="400" height="70" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="600" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#8e1b12">skeptic (referee)</text>
  <text x="600" y="475" text-anchor="middle" font-size="11.5" fill="#333">reruns one computation per specialist · tags PROVED / MACHINE-VERIFIED /</text>
  <text x="600" y="491" text-anchor="middle" font-size="11.5" fill="#333">DATABASE-QUOTED / SEARCH-EVIDENCE / CONJECTURAL · rewrites overstatements</text>
  <g stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M140,380 L560,428"/><path d="M370,380 L580,428"/><path d="M600,380 L600,428"/><path d="M830,380 L620,428"/><path d="M1060,380 L640,428"/>
  </g>

  <!-- scribe -->
  <rect x="450" y="540" width="300" height="60" rx="10" fill="#eeeeff" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="600" y="564" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2fa0">scribe</text>
  <text x="600" y="584" text-anchor="middle" font-size="11.5" fill="#333">docs/RESULTS.md: one page, every sentence carries its tag</text>
  <path d="M600,500 L600,538" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <text x="40" y="620" font-size="11" fill="#777">Runs inside Claude Code (/rigidity-attack) or unattended through the Claude Agent SDK (orchestrator/run_attack.py). The paper's proof records are never modified.</text>
</svg>
